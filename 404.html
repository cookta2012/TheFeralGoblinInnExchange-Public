<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Feral Goblin Inn</title>
    <script>
      // GitHub Pages serves this file for unknown paths. Re-route back through index.html
      // while preserving the client-side route for React Router.
      ;(function (location) {
        var pathSegmentsToKeep = location.hostname.endsWith('.github.io') ? 1 : 0
        var path = location.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~')

        var query = location.search
          ? '&' + location.search.slice(1).replace(/&/g, '~and~')
          : ''

        location.replace(
          location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
          location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' + path + query + location.hash,
        )
      })(window.location)
    </script>
  </head>
  <body></body>
</html>
